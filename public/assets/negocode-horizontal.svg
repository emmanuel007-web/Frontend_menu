  <!-- Brand Typography -->
  <g transform="translate(195, 78)">
    <text font-family="system-ui, -apple-system, 'Montserrat', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="64" letter-spacing="-1">
