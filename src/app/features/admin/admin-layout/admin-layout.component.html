<div class="min-h-screen bg-stone-50 lg:flex">
  <!-- Mobile Header Bar -->
  <header class="lg:hidden bg-white border-b border-stone-200 px-4 py-3 flex items-center justify-between sticky top-0 z-30 shadow-sm">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-primary-500 to-amber-500 flex items-center justify-center text-white shadow-sm">
        <span class="text-base">🍽️</span>
      </div>
      <h1 class="text-base font-extrabold text-stone-900 tracking-tight">Menu SaaS</h1>
    </div>
    
    <button
      (click)="toggleMobileMenu()"
      class="p-2 rounded-xl text-stone-600 hover:bg-stone-100 transition-colors focus:outline-none"
      aria-label="Abrir menú de navegación"
    >
      @if (mobileMenuOpen()) {
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
      }
    </button>
  </header>

  <!-- Mobile Overlay Backdrop -->
  @if (mobileMenuOpen()) {
    <div
      (click)="closeMobileMenu()"
      class="lg:hidden fixed inset-0 bg-stone-900/40 backdrop-blur-xs z-40 anim-fade-in"
    ></div>
  }

  <!-- Sidebar (Desktop static & Mobile slide-over drawer) -->
  <aside
    class="fixed inset-y-0 left-0 z-50 w-72 bg-white border-r border-stone-200 flex flex-col shrink-0 shadow-xl lg:shadow-none lg:static lg:z-auto transition-transform duration-300 ease-out"
    [class.-translate-x-full]="!mobileMenuOpen()"
    [class.translate-x-0]="mobileMenuOpen()"
    [class.lg:translate-x-0]="true"
  >
    <!-- Brand -->
    <div class="px-6 py-5 border-b border-stone-100 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary-500 to-amber-500 flex items-center justify-center shadow-md shadow-primary-200">
          <span class="text-lg">🍽️</span>
        </div>
        <div>
          <h1 class="text-lg font-extrabold text-stone-900 tracking-tight">Menu SaaS</h1>
          <p class="text-[11px] font-medium text-stone-400 uppercase tracking-wider">Panel de administración</p>
        </div>
      </div>

      <!-- Close button on mobile -->
      <button (click)="closeMobileMenu()" class="lg:hidden text-stone-400 hover:text-stone-700 p-1">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Nav Links -->
    <nav class="flex-1 px-4 py-5 space-y-1.5 overflow-y-auto">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-primary-50 text-primary-700 font-bold border-primary-200 shadow-xs"
          [routerLinkActiveOptions]="{ exact: false }"
          (click)="closeMobileMenu()"
          class="group flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold text-stone-600 hover:bg-stone-100 hover:text-stone-900 border border-transparent transition-all duration-200"
        >
          <span class="text-xl group-hover:scale-110 transition-transform duration-200">{{ item.icon }}</span>
          {{ item.label }}
        </a>
      }
    </nav>

    <!-- User Info + Logout -->
    <div class="px-4 py-5 border-t border-stone-100">
      <div class="bg-stone-50 rounded-2xl p-4 border border-stone-100">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-primary-400 to-amber-400 flex items-center justify-center text-white font-bold text-sm shadow-sm">
            {{ user()?.name?.charAt(0) ?? '?' }}
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-bold text-stone-900 truncate">{{ user()?.name }}</p>
            <p class="text-xs text-stone-400 truncate">{{ user()?.email }}</p>
          </div>
        </div>
        <div class="flex items-center justify-between mt-3 pt-2 border-t border-stone-200/60">
          <span class="text-[10px] font-extrabold text-primary-600 bg-primary-50 px-2 py-0.5 rounded-md uppercase tracking-wider">
            {{ user()?.role }}
          </span>
          <button
            (click)="logout()"
            class="text-xs font-bold text-red-500 hover:text-red-600 hover:bg-red-50 px-2 py-1 rounded-lg transition-all duration-200"
          >
            Cerrar sesión
          </button>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 min-w-0 min-h-screen">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <router-outlet />
    </div>
  </main>
</div>
