<div class="min-h-screen lg:flex">
  <!-- Sidebar -->
  <aside class="lg:w-64 bg-slate-900 text-slate-200 flex flex-col shrink-0">
    <div class="px-6 py-5 border-b border-slate-800">
      <h1 class="text-xl font-bold text-white">🍽️ Menu SaaS</h1>
      <p class="text-xs text-slate-400 mt-0.5">Panel de administración</p>
    </div>

    <nav class="flex-1 px-3 py-4 space-y-1">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-slate-800 text-white"
          [routerLinkActiveOptions]="{ exact: false }"
          class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition"
        >
          <span class="text-base">{{ item.icon }}</span>
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="px-4 py-4 border-t border-slate-800">
      <p class="text-sm font-medium text-slate-200 truncate">{{ user()?.name }}</p>
      <p class="text-xs text-slate-400 truncate">{{ user()?.email }}</p>
      <span class="inline-block mt-2 text-[11px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded-full">
        {{ user()?.role }}
      </span>
      <button
        (click)="logout()"
        class="mt-3 w-full text-left text-sm text-red-400 hover:text-red-300 hover:bg-slate-800 rounded-lg px-3 py-2 transition"
      >
        Cerrar sesión
      </button>
    </div>
  </aside>

  <!-- Contenido -->
  <main class="flex-1 min-w-0">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <router-outlet />
    </div>
  </main>
</div>
